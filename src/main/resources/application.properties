spring.application.name=wedding
jwt.secret=${JWT_SECRET}
gallery.password=${GALLERY_PASSWORD}
# Cloud Run gibt den Port ueber PORT vor
server.port=${PORT:8080}
# Zugang zum privaten R2-Bucket: GALLERY_STORAGE_ENDPOINT, _BUCKET, _ACCESS_KEY, _SECRET_KEY
# Zahl der vertrauten Proxys vor dem Dienst (Firebase Hosting, Cloud Run); bestimmt die Client-IP fuer das Login-Limit
gallery.trusted-proxy-hops=${TRUSTED_PROXY_HOPS:1}
